name: Build & push mod image

on:
  push:
    branches: [main]
    paths:
      - proxy.c
      - Dockerfile
      - rootfs/**
      - pornolab-noquota.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/plab-prowlarr

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            tag_suffix: armv7

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to:   type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true

      - run: mkdir -p /tmp/digests && echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.tag_suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.tag_suffix }}
          path: /tmp/digests/
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/buildx-create@v3
        with:
          use: true

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(cat /tmp/digests/* | xargs -I{} echo "${{ env.IMAGE }}@{}" | tr '\n' ' ')

      - name: Make package public
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/plab-prowlarr" \
            -d '{"visibility":"public"}' | jq -r '.visibility // .message'
